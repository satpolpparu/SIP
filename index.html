<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIP - SATPOL PP ARU</title>
  <link rel="icon" href="https://i.ibb.co/8ntfRfsF/Logo-Satpol.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      overflow: hidden;
      background: #f1f0e5;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.05rem;
      color: #536142;
      z-index: 1;
      pointer-events: none;
    }
    .fallback {
      position: fixed;
      left: 12px;
      right: 12px;
      bottom: calc(8px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      text-align: center;
      font-size: 12px;
    }
    .fallback a { color: #35583d; }
  </style>
</head>
<body>
  <main class="iframe-container">
    <div class="loader" id="loader">Memuat aplikasi…</div>
    <iframe
      src="https://script.google.com/macros/s/AKfycbzWm1LEY_8OR6hUUa3wMx25Spe10BytIztR4xFJB-CsHiOxz9s19xVIct7kQDdo4qUi1g/exec"
      title="SIP SATPOL PP ARU"
      allowfullscreen
      onload="document.getElementById('loader').hidden = true; document.getElementById('fallback').hidden = true;">
    </iframe>
    <div class="fallback" id="fallback" hidden>
      Jika menu bawah masih terpotong atau aplikasi tidak tampil,
      <a href="https://script.google.com/macros/s/AKfycbzWm1LEY_8OR6hUUa3wMx25Spe10BytIztR4xFJB-CsHiOxz9s19xVIct7kQDdo4qUi1g/exec" target="_blank" rel="noopener">buka aplikasi langsung</a>.
    </div>
  </main>
</body>
</html>
